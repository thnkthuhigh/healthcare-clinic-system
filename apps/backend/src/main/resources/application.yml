server:
  port: ${SERVER_PORT:4000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:hc-clinic-super-secret-key-must-be-at-least-64-bytes-long-for-hs512!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  owner:
    phone: ${OWNER_PHONE:0900000000}
    password: ${OWNER_PASSWORD:owner123}
  sms:
    provider: ${SMS_PROVIDER:none}
    brand-name: ${SMS_BRAND_NAME:Healthcare Clinic}
    default-country-code: ${SMS_DEFAULT_COUNTRY_CODE:84}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from-number: ${TWILIO_FROM_NUMBER:}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    payment-url: ${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
    api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
    return-url: ${VNPAY_RETURN_URL:http://localhost:4000/api/v1/payments/vnpay/return}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}
    mock-enabled: ${VNPAY_MOCK_ENABLED:true}
  demo:
    refresh-on-startup: ${APP_DEMO_REFRESH_ON_STARTUP:false}

spring:
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinic_dev?stringtype=unspecified}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Ho_Chi_Minh'
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui
