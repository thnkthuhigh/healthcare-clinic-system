services:
  postgres:
    image: postgres:16
    container_name: clinic_postgres
    restart: unless-stopped
    command: ['postgres', '-c', 'timezone=Asia/Ho_Chi_Minh']
    environment:
      POSTGRES_DB: clinic_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: Asia/Ho_Chi_Minh
    ports:
      - '5432:5432'
    volumes:
      - clinic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d clinic_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: clinic_backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      SERVER_PORT: 4000
      TZ: Asia/Ho_Chi_Minh
      DB_URL: jdbc:postgresql://postgres:5432/clinic_dev?stringtype=unspecified
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: hc-clinic-super-secret-key-must-be-at-least-64-bytes-long-for-hs512!!
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      OWNER_PHONE: '0900000000'
      OWNER_PASSWORD: owner123
      SMS_PROVIDER: ${SMS_PROVIDER:-none}
      SMS_BRAND_NAME: ${SMS_BRAND_NAME:-Healthcare Clinic}
      SMS_DEFAULT_COUNTRY_CODE: ${SMS_DEFAULT_COUNTRY_CODE:-84}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:4000/api/v1/payments/vnpay/return}
      VNPAY_EXPIRE_MINUTES: ${VNPAY_EXPIRE_MINUTES:-15}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:4000/api/v1/health >/dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: clinic_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      - ./apps/web/dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy

volumes:
  clinic_postgres_data:
