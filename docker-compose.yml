services:
  postgres:
    image: postgres:16
    container_name: clinic_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: clinic_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: UTC
    ports:
      - '5432:5432'
    volumes:
      - clinic_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d clinic_dev']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clinic_postgres_data:
